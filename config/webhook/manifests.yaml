---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-tenancy-opendatahub-io-v1alpha1-platformtenant
  failurePolicy: Fail
  name: vplatformtenant-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tenancy.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - platformtenants
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-tenancy-opendatahub-io-v1alpha1-tenantprofile
  failurePolicy: Fail
  name: vtenantprofile-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tenancy.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tenantprofiles
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-tenancy-opendatahub-io-v1alpha1-tenantproject
  failurePolicy: Fail
  name: vtenantproject-v1alpha1.kb.io
  rules:
  - apiGroups:
    - tenancy.opendatahub.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - tenantprojects
  sideEffects: None
