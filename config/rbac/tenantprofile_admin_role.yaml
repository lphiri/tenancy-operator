# This rule is not used by the project tenancy-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over tenancy.opendatahub.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tenancy-operator
    app.kubernetes.io/managed-by: kustomize
  name: tenantprofile-admin-role
rules:
- apiGroups:
  - tenancy.opendatahub.io
  resources:
  - tenantprofiles
  verbs:
  - '*'
- apiGroups:
  - tenancy.opendatahub.io
  resources:
  - tenantprofiles/status
  verbs:
  - get
