# This rule is not used by the project tenancy-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to tenancy.opendatahub.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tenancy-operator
    app.kubernetes.io/managed-by: kustomize
  name: platformtenant-viewer-role
rules:
- apiGroups:
  - tenancy.opendatahub.io
  resources:
  - platformtenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - tenancy.opendatahub.io
  resources:
  - platformtenants/status
  verbs:
  - get
